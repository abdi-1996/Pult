name: Build TouchDisplay v2 APK + Host + Display Driver

on:
  push:
    branches: [touchdisplay-v2]
    paths:
      - 'TouchDisplayAndroid/**'
      - 'TouchDisplayHost/**'
      - '.github/workflows/build-touchdisplay-v2.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android v2 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply TouchDisplay v2 patches
        run: |
          python TouchDisplayAndroid/patch-v1.7.py
          sed -i 's/cancelLongPress()/cancelLongPressGesture()/g' TouchDisplayAndroid/app/src/main/java/kz/pult/touchdisplay/MainActivity.kt
          python TouchDisplayAndroid/patch-v2.py
      - name: Build APK
        run: |
          gradle -p TouchDisplayAndroid :app:assembleDebug --no-daemon --stacktrace
          cp TouchDisplayAndroid/app/build/outputs/apk/debug/app-debug.apk TouchDisplay-v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchDisplay-Android-v2
          path: TouchDisplay-v2.apk
          if-no-files-found: error
          retention-days: 30

  host:
    name: Windows Host v2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply TouchDisplay v2 host patches
        shell: pwsh
        run: ./TouchDisplayHost/patch-v2.0.ps1
      - name: Build self-contained Host
        shell: pwsh
        run: |
          dotnet restore TouchDisplayHost/TouchDisplayHost.csproj
          dotnet publish TouchDisplayHost/TouchDisplayHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o TouchDisplayHost/out
          Copy-Item TouchDisplayHost/out/TouchDisplayHost.exe TouchDisplayHost-v2.exe
      - name: Upload Host
        uses: actions/upload-artifact@v4
        with:
          name: TouchDisplay-Windows-Host-v2
          path: TouchDisplayHost-v2.exe
          if-no-files-found: error
          retention-days: 30

  display-driver:
    name: Windows Display 2 Driver beta
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK + WDK 28000 for Visual Studio 2026
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsSDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          winget install --id Microsoft.WindowsWDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Get Microsoft IddCx sample
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Windows-driver-samples.git driver-samples
          cd driver-samples
          git sparse-checkout set video/IndirectDisplay
      - name: Customize as one TouchDisplay virtual monitor
        shell: pwsh
        run: |
          $p = 'driver-samples/video/IndirectDisplay/IddSampleDriver/Driver.cpp'
          $t = Get-Content $p -Raw
          $t = $t.Replace('static constexpr DWORD IDD_SAMPLE_MONITOR_COUNT = 3;', 'static constexpr DWORD IDD_SAMPLE_MONITOR_COUNT = 1;')
          $t = $t.Replace('L"IddSample Device"', 'L"TouchDisplay Virtual Display"')
          $t = $t.Replace('L"Microsoft"', 'L"TouchDisplay"')
          $t = $t.Replace('L"IddSample Model"', 'L"Android Tablet Display"')
          $needle = 'TargetModes.push_back(CreateIddCxTargetMode(2560, 1440, 60));'
          $repl = "TargetModes.push_back(CreateIddCxTargetMode(2560, 1600, 60));`r`n    TargetModes.push_back(CreateIddCxTargetMode(1920, 1200, 60));`r`n    TargetModes.push_back(CreateIddCxTargetMode(1280, 800, 60));`r`n    $needle"
          $t = $t.Replace($needle, $repl)
          Set-Content $p $t -Encoding UTF8
      - name: Build IddCx driver and software-device launcher
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild 'driver-samples/video/IndirectDisplay/IddSampleDriver.sln' /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Driver build failed: $LASTEXITCODE" }
      - name: Package driver beta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TouchDisplay-Display2-Driver | Out-Null
          Get-ChildItem driver-samples/video/IndirectDisplay -Recurse -File | Where-Object { $_.Extension -in '.dll','.inf','.cat','.exe','.cer' } | Copy-Item -Destination TouchDisplay-Display2-Driver -Force
          @'
          @echo off
          echo TouchDisplay v2 Display 2 beta installer
          echo This development driver requires Windows Test Signing mode and one reboot.
          bcdedit /set testsigning on
          echo Restart Windows, then run Install-Driver-After-Reboot.cmd as Administrator.
          pause
          '@ | Set-Content TouchDisplay-Display2-Driver/Enable-Test-Mode.cmd -Encoding ASCII
          @'
          @echo off
          cd /d "%~dp0"
          for %%F in (*.inf) do pnputil /add-driver "%%F" /install
          for %%F in (*IddSampleApp*.exe) do start "TouchDisplay Display 2" /min "%%F"
          echo Open Windows Settings - System - Display and select Extend these displays.
          pause
          '@ | Set-Content TouchDisplay-Display2-Driver/Install-Driver-After-Reboot.cmd -Encoding ASCII
          Compress-Archive -Path TouchDisplay-Display2-Driver/* -DestinationPath TouchDisplay-Display2-Driver-v2-beta.zip -Force
      - name: Upload Display 2 driver
        uses: actions/upload-artifact@v4
        with:
          name: TouchDisplay-Display2-Driver-v2-beta
          path: TouchDisplay-Display2-Driver-v2-beta.zip
          if-no-files-found: error
          retention-days: 30
