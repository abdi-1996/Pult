name: Build TouchDisplay Mobile Web v1.1.1 Navigation Fix

on:
  push:
    branches: [touchdisplay-mobile-web-v1]
    paths:
      - 'TouchDisplayMobileWeb/**'
      - '.github/workflows/build-touchdisplay-mobile-web-v1.yml'
  workflow_dispatch:

jobs:
  build:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained EXE
        shell: pwsh
        run: |
          dotnet restore TouchDisplayMobileWeb/TouchDisplayMobileWeb.csproj
          dotnet publish TouchDisplayMobileWeb/TouchDisplayMobileWeb.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o TouchDisplayMobileWeb/out
          Copy-Item TouchDisplayMobileWeb/out/TouchDisplayMobileWeb.exe TouchDisplay-Mobile-Web-v1.1.1.exe
          Get-Item TouchDisplay-Mobile-Web-v1.1.1.exe | Format-List Name,Length
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TouchDisplay-Mobile-Web-v1.1
          path: TouchDisplay-Mobile-Web-v1.1.1.exe
          if-no-files-found: error
          retention-days: 30
