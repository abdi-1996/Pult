name: Build TouchDisplay UI Patch v1.2.2

on:
  push:
    branches: [touchdisplay-mobile-web-v1]
    paths:
      - 'TouchDisplayMobileWeb/wwwroot/**'
      - 'TouchDisplayPatchUpdater/**'
      - '.github/workflows/build-touchdisplay-patch-v1.2.2.yml'
  workflow_dispatch:

jobs:
  build:
    name: UI Patch EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build UI patch updater
        shell: pwsh
        run: |
          dotnet restore TouchDisplayPatchUpdater/TouchDisplayPatchUpdater.csproj
          dotnet publish TouchDisplayPatchUpdater/TouchDisplayPatchUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out
          Copy-Item out/TouchDisplay-Update-v1.2.2.exe TouchDisplay-Update-v1.2.2.exe
          Get-Item TouchDisplay-Update-v1.2.2.exe | Format-List Name,Length

      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: TouchDisplay-Update-v1.2.2
          path: TouchDisplay-Update-v1.2.2.exe
          if-no-files-found: error
          retention-days: 30
